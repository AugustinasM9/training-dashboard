<!-- Quick redirect fix - add this at top of dashboard.html <head> -->
<script>
// On page load, check if we have a token in sessionStorage/localStorage
// If yes, send it as a header for API validation
const tok = sessionStorage.getItem('dash_token') || localStorage.getItem('dash_token') || '';
if(tok) {
  fetch(window.location.href, {
    headers: {'X-Dash-Token': tok}
  }).then(r => {
    if(!r.ok && r.status === 401) {
      // Token is invalid, go to login
      window.location.href = '/login';
    }
  }).catch(e => console.log('Auth check:', e));
}
</script>
